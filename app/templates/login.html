{% extends 'base.html' %}
{% block title %}Login | STUDENTVERA AI{% endblock %}
{% block auth_content %}
<div class="login-shell">
    <div class="login-card">
        <div class="login-header">
            <div class="brand-mark brand-mark-large">S</div>
            <h1>STUDENTVERA AI</h1>
            <p>DEMONSTRATION ENVIRONMENT — FICTIONAL DATA</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Institution email</label>
            <input id="email" name="email" type="email" placeholder="admin@demo.local" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <div class="demo-credentials">
            <h3>Demo credentials</h3>
            <p><strong>Admin:</strong> admin@demo.local / Admin@123</p>
            <p><strong>Operator:</strong> operator@demo.local / Operator@123</p>
        </div>
    </div>
</div>
{% endblock %}
